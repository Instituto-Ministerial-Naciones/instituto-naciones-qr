<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005b92">
  <meta name="description" content="Registro de asistencia del Instituto Ministerial Naciones.">
  <title>Registro de asistencia | Instituto Naciones</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=registro-03">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png?v=registro-03">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=registro-03">
  <link rel="manifest" href="./manifest.webmanifest?v=registro-03">
  <link rel="stylesheet" href="./styles.css?v=registro-03">
</head>
<body>
  <header class="topbar" aria-label="Instituto Ministerial Naciones">
    <img class="brand-mark" src="./assets/logo-mark-white.png?v=registro-03" alt="Instituto Ministerial Naciones" width="150" height="147">
  </header>

  <main class="screen">
    <section class="scanner-stage" aria-label="Lector de código QR">
      <div class="camera-window" id="camera-window">
        <div id="reader" class="reader"></div>
      </div>
      <div class="frame-corners" aria-hidden="true">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
      </div>
    </section>

    <section class="person-data" aria-live="polite">
      <h1 class="field-label">NOMBRE</h1>
      <div class="value-field" id="person-name">NOMBRE COMPLETO</div>

      <h2 class="field-label pass-label">PASE PARA:</h2>
      <div class="value-field" id="person-count">0 PERSONAS</div>
    </section>

    <button class="register-button" id="register-button" type="button">REGISTRAR ASISTENCIA</button>
    <p class="scan-status" id="scan-status" role="status" aria-live="polite">Pulsa el botón para activar la cámara y escanear un código QR.</p>
  </main>

  <script src="./config.js?v=registro-03"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="./app.js?v=registro-03" defer></script>
</body>
</html>
