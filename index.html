<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005B92">
  <meta name="description" content="Registro de asistencia del Instituto Ministerial Naciones.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Naciones QR">
  <meta name="naciones-build" content="exacto-20261120-01">
  <title>Registro de asistencia | Instituto Naciones</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png?v=exacto-01">
  <link rel="apple-touch-icon" href="assets/icon-192.png?v=exacto-01">
  <link rel="manifest" href="manifest.webmanifest?v=exacto-01">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=exacto-01">
</head>
<body>
  <header class="topbar" aria-label="Instituto Ministerial Naciones">
    <img class="brand-mark" src="assets/logo-mark-white.png?v=exacto-01" alt="Instituto Ministerial Naciones">
  </header>

  <main class="screen">
    <section class="scanner-stage" aria-label="Lector de código QR">
      <div class="camera-window" id="camera-window">
        <div id="reader" class="reader"></div>
      </div>
      <div class="frame-corners" aria-hidden="true">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
      </div>
    </section>

    <section class="person-data" aria-live="polite">
      <h1 class="field-label">NOMBRE</h1>
      <div class="value-field" id="person-name">NOMBRE COMPLETO</div>

      <h2 class="field-label pass-label">PASE PARA:</h2>
      <div class="value-field" id="person-count">0 PERSONAS</div>
    </section>

    <button class="register-button" id="register-button" type="button" aria-pressed="false">
      REGISTRAR ASISTENCIA
    </button>

    <p class="sr-only" id="scan-status" role="status" aria-live="polite">Preparado para escanear.</p>
  </main>

  <script src="config.js?v=exacto-01"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="app.js?v=exacto-01" defer></script>
</body>
</html>
